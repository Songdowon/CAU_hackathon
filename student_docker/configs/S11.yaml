# S11 — noce matched control + state-triggered cosine tail
script: S11.py
# noce — relfe에서 lambda_ce_f 0 — headfit이 Acc_f를 공짜로 0으로 만드니 forget 정확도에 쓰던 용량을 회수한다 (단일 변수)
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 7200
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.0
  lambda_cka_f: 3.0
  lambda_cka_r: 2.0
  cka_floor: 0.05
  freeze_norm: true
  ema_decay: 0.99
  lambda_l2sp: 0.0
  lr_schedule: state_triggered_cosine_tail
  lr_final: 3.0e-06
  lr_trigger_min_step: 3600
  lr_trigger_window: 200
  lr_trigger_off_ratio: 0.40
  lr_trigger_ema_beta: 0.98
output:
  save_path: models/S11.pt
