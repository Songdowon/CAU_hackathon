# mavg — 아래 config로 학습한 궤적의 **스텝 3000~3800 스냅샷 5개를 균등 평균**한 것이다.
# (train.ckpt_every 200 / ckpt_from 2000 → models/ckar8m_s3000.pt ~ _s3800.pt)
#
# 구간 선택 규칙(사전 고정): 같은 궤적에서 CKA_f <= 0.006 이고 CKA_r >= 0.9952 가
# 연속으로 유지되는 구간 전체. 최종 점수를 보고 고른 것이 아니라 CKA 지표의
# plateau로 잘랐다. 다른 seed의 궤적은 절대 섞지 않는다 — seed가 다르면 삭제
# 방향이 달라 평균 시 CKA_f가 0.0044에서 0.2205로 붕괴하는 것을 실측했다.
#
# 이후 tools/headfit.py 로 head만 보정했다 (--epochs 8 --lr 3e-3). backbone은
# 건드리지 않으므로 CKA_f/CKA_r은 이 단계에서 변하지 않는다.
# ckar6에서 최고점이 가장 이른 스냅샷이었고 CKA_r이 학습 진행에 따라 감소했다.
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4600
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.0
  lambda_cka_f: 3.0
  lambda_cka_r: 8.0
  cka_floor: 0.05
  freeze_norm: true
  ema_decay: 0.99
  lambda_l2sp: 0.0
  ckpt_from: 2000
  ckpt_every: 200
output:
  save_path: models/ckar8m.pt
