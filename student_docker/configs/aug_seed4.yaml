# aug_seed4 — s06 + retain 증강 강화 (rand-m15, reprob 0.4) seed 4 — 일반화 갭 축소
seed: 4
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4800
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.5
  lambda_cka_f: 2.0
  cka_floor: 0.05
  freeze_norm: true
  retain_aug: rand-m15-mstd0.5-inc1
  retain_reprob: 0.4
output:
  save_path: models/aug_seed4.pt
