# S02-6 — classifier만 학습, norm/전체 backbone 동결
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 2400
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 1.0
  lambda_kd_r: 1.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.5
  lambda_cka_f: 2.0
output:
  save_path: models/S02-6.pt
  selection_report: results/S02-6.selection.json
script: S02.py
selection:
  mode: head_only
  count: 0
  train_norm: false
  train_head: true
