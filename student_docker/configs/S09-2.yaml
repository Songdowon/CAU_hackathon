# S09-2 — r019 동일 loss/seed, 마지막 2400 updates만 cosine decay to 0
# Selection: hard CKA_f <= 0.03; primary final; secondary CKA_r/RUS;
# stability: compare against same-seed r019.
script: S09.py
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 7200
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.5
  lambda_cka_f: 2.0
  lr_schedule: cosine_tail
  lr_tail_start: 4800
  lr_final: 0.0
output:
  save_path: models/S09-2.pt
