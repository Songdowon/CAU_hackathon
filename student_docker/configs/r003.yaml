# r003 — forget 가중치 강화 (remap 3.0, ce_f 2.0)
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 400
  lr: 1.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 1.0
  lambda_kd_r: 1.0
  lambda_ce_r: 0.0
  lambda_remap_f: 3.0
  lambda_ce_f: 2.0
  lambda_cka_f: 0.0
output:
  save_path: models/r003.pt
