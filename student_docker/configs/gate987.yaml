# gate987 — 학습 config가 아니라 "레시피"다. 아래 9개 실험 가중치의 균등 평균.
#
# 재료 선정 규칙 (조합 탐색 없음. 로컬 점수로 조합을 고르면 그 표본에서 운 좋은
