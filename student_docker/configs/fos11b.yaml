# fos11b — fos11a와 동일, lr만 1e-3 -> 1e-2. CKA_f 감속이 capacity 한계인지
# 최적화 속도인지 판정한다 (스냅샷은 B가 state_dict 밖이라 무의미해서 끔).
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 1200
  lr: 0.01
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.0
  lambda_cka_f: 3.0
  lambda_cka_r: 2.0
  cka_floor: 0.05
  freeze_norm: true
  ema_decay: 0.0
  lambda_l2sp: 0.0
  ckpt_from: 200
  ckpt_every: 0
  fos11: true
output:
  save_path: models/fos11b.pt
