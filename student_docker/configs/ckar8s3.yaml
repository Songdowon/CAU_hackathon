# ckar8s3 — 검증된 레시피(lambda_cka_r 8.0, 2000부터 200스텝마다 13스냅샷,
# 전부 평균, 임계값 0개)를 seed 3로. seed0은 CKA_f 0.00438, seed2는 0.03826으로
# 궤적 자체가 시드 복권이다. 뽑기를 더 한다.
seed: 3
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4600
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.0
  lambda_cka_f: 3.0
  lambda_cka_r: 8.0
  cka_floor: 0.05
  freeze_norm: true
  ema_decay: 0.99
  lambda_l2sp: 0.0
  ckpt_from: 2000
  ckpt_every: 200
output:
  save_path: models/ckar8s3.pt
