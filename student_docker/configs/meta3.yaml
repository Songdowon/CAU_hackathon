# meta3 — 같은 λ=8 seed0 궤적에서 만든 0-임계값 후보 셋(mall 13개@200,
# d25 25개@100, d36 36개@100/구간확대)을 다시 균등 평균한 것. 모두 같은
# 궤적이라 삭제 방향이 정렬돼 있고, 고르는 행위 없이 규칙으로만 합쳤다.
# 따라서 평균은 한 궤적 안에서만 하고, 표본만 13 -> 36으로 늘린다.
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4600
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.0
  lambda_cka_f: 3.0
  lambda_cka_r: 8.0
  cka_floor: 0.05
  freeze_norm: true
  ema_decay: 0.99
  lambda_l2sp: 0.0
  ckpt_from: 1000
  ckpt_every: 100
output:
  save_path: models/ckar8d.pt
