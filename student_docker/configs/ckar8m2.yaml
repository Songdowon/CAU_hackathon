# ckar8m2 — ckar8m(lambda_cka_r 8.0, 2000부터 200스텝마다 13스냅샷)의 seed 2.
# lambda_cka_r 12는 로컬만 오르고 private은 -0.0028로 무너졌다(같은 선택 방식에서
# λ=8은 -0.0009). 전이가 확인된 λ=8에 머무르며 평균 표본만 2배로 늘린다.
seed: 2
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4600
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.0
  lambda_cka_f: 3.0
  lambda_cka_r: 8.0
  cka_floor: 0.05
  freeze_norm: true
  ema_decay: 0.99
  lambda_l2sp: 0.0
  ckpt_from: 2000
  ckpt_every: 200
output:
  save_path: models/ckar8m2.pt
