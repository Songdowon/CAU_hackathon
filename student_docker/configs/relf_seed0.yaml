# relf_seed0 — rel + forget 압력 강화 (7200스텝, cka_f 3.0) seed 0 — rel이 번 CKA_r 여유를 forget에 투입
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 7200
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.5
  lambda_cka_f: 3.0
  lambda_cka_r: 2.0
  cka_floor: 0.05
  freeze_norm: true
output:
  save_path: models/relf_seed0.pt
