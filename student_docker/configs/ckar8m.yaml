# ckar8m — ckar8(lambda_cka_r 8.0) 궤적 채굴. 4600스텝에서 절단(lr 상수라 그 구간
# 스냅샷은 7200스텝 실행과 동일). 2000부터 200스텝마다 = 13뽑기.
# ckar6에서 최고점이 가장 이른 스냅샷이었고 CKA_r이 학습 진행에 따라 감소했다.
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4600
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.0
  lambda_cka_f: 3.0
  lambda_cka_r: 8.0
  cka_floor: 0.05
  freeze_norm: true
  ema_decay: 0.99
  lambda_l2sp: 0.0
  ckpt_from: 2000
  ckpt_every: 200
output:
  save_path: models/ckar8m.pt
