# S03 — r017 trajectory: equal mean of steps 3600/4000/4400/4800; last/EMA siblings
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4800
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.5
  lambda_cka_f: 2.0
output:
  save_path: models/S03.pt
  last_path: models/S03-last.pt
  ema_paths:
    ema099: models/S03-ema099.pt
    ema0999: models/S03-ema0999.pt
  trajectory_report: results/S03.trajectory.json
  training_log: logs/S03.training.log
script: S03.py
averaging:
  ema_start: 2400
  ema_decays:
    ema099: 0.99
    ema0999: 0.999
  checkpoint_steps:
  - 3600
  - 4000
  - 4400
  - 4800
  snapshot_dir: models/S03_checkpoints
