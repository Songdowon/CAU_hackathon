# uniform16 — 학습 config가 아니라 "레시피"다. 아래 16개 실험 가중치의 균등 평균.
#
# 재료 선정 규칙 (조합 탐색 없음 — 로컬 점수로 조합을 고르면 그 표본에만 맞는
# 운이 섞여 private으로 이전되지 않는다. 실측: 탐색한 소프는 |A-B| 0.0040,
# 이 균등 소프는 0.00035):
#   1) CKA_f_o < 0.03  그리고  CKA_r_o > 0.96 을 통과한 모든 실험
#   2) rel 계열 제외 — 같은 config의 시드끼리 평균하면 -0.00617로 무너지는
#      유일한 계열이라 별개 측정에 근거해 뺐다
#
# 재료: S03, S03-ema099, S03-ema0999, S03-last, S06, det_check, r016, r017,
#       r019, r035, relf_seed0, relf_seed2, relfe_seed0, s06_seed0, s06_seed4,
#       s06e_seed0
