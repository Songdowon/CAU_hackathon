# S02 — CE-gradient ratio로 선택한 6블록 + norm/head
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 2400
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 1.0
  lambda_kd_r: 1.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.5
  lambda_cka_f: 2.0
output:
  save_path: models/S02.pt
  selection_report: results/S02.selection.json
script: S02.py
selection:
  mode: gradient_ratio
  count: 6
  train_norm: true
  train_head: true
  probe:
    batch_size: 32
    batches: 8
    seed: 1702
    epsilon: 1.0e-08
    min_norm: 1.0e-08
