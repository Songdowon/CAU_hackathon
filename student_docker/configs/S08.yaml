# S08 - matched s06_seed0 + Fisher-weighted retain anchoring
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4800
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.5
  lambda_cka_f: 2.0
  cka_floor: 0.05
  freeze_norm: true
  fisher_scope: last_6_blocks
  fisher_samples: 4096
  normalize_fisher_per_layer: true
  lambda_anchor: 0.001
output:
  save_path: models/S08.pt
  report: results/S08.run.json
script: S08.py
