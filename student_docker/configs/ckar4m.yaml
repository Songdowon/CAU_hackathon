# ckar4m — mall(champion)과 완전히 동일한 채굴 레시피에서 lambda_cka_r만 8 -> 4.
# 구간 2000~4600, 간격 200, 13개 전부 평균, 임계값 0개. lambda 4는 단일 모델
# 제출에서 갭 -0.0006으로 전이가 좋았다(나빴던 것은 lambda 12).
seed: 0
model:
  arch: vit_base_patch16_224.mae
  num_classes: 100
  mo_ckpt: m_o/M_o.pt
data:
  split: splits/student_split.pt
  forget: es/es_imagenet_mo/forget10.json
  batch_size: 128
  workers: 8
train:
  steps: 4600
  lr: 3.0e-05
  optimizer: AdamW
  weight_decay: 0.0
  trainable_blocks: 6
  kd_temperature: 2.0
  clip_grad: 1.0
  lambda_feat_r: 2.0
  lambda_kd_r: 2.0
  lambda_ce_r: 0.0
  lambda_remap_f: 1.0
  lambda_ce_f: 0.0
  lambda_cka_f: 3.0
  lambda_cka_r: 4.0
  cka_floor: 0.05
  freeze_norm: true
  ema_decay: 0.99
  lambda_l2sp: 0.0
  ckpt_from: 2000
  ckpt_every: 200
output:
  save_path: models/ckar4m.pt
