[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info

[program:fastapi]
command=/opt/conda/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/opt/hackathon
user=root
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/fastapi.err.log
stdout_logfile=/var/log/supervisor/fastapi.out.log
environment=PYTHONUNBUFFERED="1",PYTHONNOUSERSITE="1",PYTHONPATH="/opt/hackathon:/opt/hackathon/scorer",HOME="/root"
priority=1

[program:code-server]
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth password /workspace
directory=/workspace
user=participant
# Do not expose secret fallback environment values to the participant shell.
# Production deployments should mount *_FILE targets root:root mode 0400/0600.
environment=HOME="/home/participant",PASSWORD="%(ENV_CODE_SERVER_PASSWORD)s",CODE_SERVER_PASSWORD="",CODE_SERVER_PASSWORD_FILE="",HACKATHON_API_KEY="",HACKATHON_API_KEY_FILE="",STUDENT_API_KEY="",STUDENT_API_KEY_FILE="",TEAM_SUBMIT_PASSWORD="",TEAM_SUBMIT_PASSWORD_FILE="",SUBMIT_PASSWORD_FILE="",GRADING_API_TOKEN="",GRADING_API_TOKEN_FILE="",HF_STUDENT_TOKEN="",HF_TOKEN="",HUGGING_FACE_HUB_TOKEN=""
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/code-server.err.log
stdout_logfile=/var/log/supervisor/code-server.out.log
priority=2

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
priority=3
